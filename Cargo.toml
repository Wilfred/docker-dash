[package]
name = "docker-dash"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A read-only web dashboard for local Docker containers"

[dependencies]
askama = "0.16"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
humantime = "2"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "signal", "io-util", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
